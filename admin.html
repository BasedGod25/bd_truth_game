<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Game Admin</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #1a1a2e; --card: #16213e; --acc: #e94560; --txt: #fff; }
        body { font-family: 'Montserrat'; background: var(--bg); color: var(--txt); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 15px 30px; background: #333; cursor: pointer; border-radius: 8px; font-weight: bold; opacity: 0.6; }
        .tab.active { background: var(--acc); opacity: 1; }
        
        /* CARDS */
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; background: #0f3460; border: 1px solid #333; color: white; margin-bottom: 10px; box-sizing: border-box; border-radius: 4px;}
        
        /* EDITOR LIST */
        .guest-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(0,0,0,0.2); margin-bottom: 5px; border-radius: 4px; cursor: pointer; border: 1px solid transparent;}
        .guest-item:hover { border-color: var(--acc); }
        .guest-item.linked { border-left: 4px solid #27ae60; }
        
        .btn { padding: 12px; background: var(--acc); border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px;}
        .btn.green { background: #27ae60; }
        .btn.red { background: #c0392b; }
        .btn.small { width: auto; padding: 5px 10px; font-size: 0.8rem; }
        
        .fact-row { display: flex; gap: 10px; align-items: center; }
        .radio-btn { min-width: 60px; height: 60px; background: #0f3460; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #333; border-radius: 4px;}
        .radio-btn.active { background: #27ae60; border-color: #fff; }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="tabs">
            <div class="tab" :class="{active: tab==='live'}" @click="tab='live'">🎥 Эфир</div>
            <div class="tab" :class="{active: tab==='edit'}" @click="tab='edit'">📝 Редактор БД</div>
        </div>

        <div v-if="tab === 'edit'">
            <div class="card">
                <h2>{{ editId ? 'Редактировать' : 'Добавить' }} гостя</h2>
                <label>Имя</label>
                <input v-model="form.name" placeholder="Например: Сергей">
                
                <div v-for="i in 3" class="fact-row">
                    <textarea v-model="form['fact'+i]" rows="2" :placeholder="'Факт '+i"></textarea>
                    <div class="radio-btn" :class="{active: form.correct === i}" @click="form.correct = i">TRUE</div>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button class="btn green" @click="saveGuest">Сохранить</button>
                    <button v-if="editId" class="btn red" @click="deleteGuest">Удалить</button>
                    <button class="btn" style="background:#555" @click="clearForm">Отмена</button>
                </div>
            </div>

            <h3>Список заготовок:</h3>
            <div v-for="(g, id) in guests" :key="id" class="guest-item" :class="{linked: g.tg_id}" @click="editGuest(id, g)">
                <div>
                    <strong>{{ g.name }}</strong>
                    <span v-if="g.tg_id" style="color: #27ae60; font-size: 0.8rem; margin-left: 10px;">● Linked</span>
                </div>
                <span style="color: #aaa">✎</span>
            </div>
        </div>

        <div v-if="tab === 'live'">
            <div class="card">
                <h2>Выбор раунда</h2>
                <div v-if="Object.keys(guests).length === 0">Нет гостей. Зайди в "Редактор" и добавь.</div>
                
                <select v-model="selectedGuestId" style="padding: 15px; font-size: 1.1rem;">
                    <option :value="null">Выберите, кто сейчас выходит...</option>
                    <option v-for="(g, id) in guests" :key="id" :value="id">
                        {{ g.name }} {{ g.tg_id ? '✅' : '⚠️ (нет TG)' }}
                    </option>
                </select>

                <button class="btn green" @click="runRound" :disabled="!selectedGuestId">
                    🚀 Вывести на экран
                </button>
            </div>

            <div class="card" v-if="activeGuest">
                <h3>В эфире: {{ activeGuest.name }}</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button class="btn" @click="api('start_voting')">▶️ Голосование</button>
                    <button class="btn" style="background: #e67e22" @click="api('reveal')">👀 Вскрыть</button>
                </div>
                <button class="btn red" @click="api('reset')">⏹ Сброс в Лобби</button>
                <p style="text-align: center; margin-top: 10px; color: #777">{{ status }}</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const tab = ref('live');
                const guests = ref({});
                const selectedGuestId = ref(null);
                const activeGuest = ref(null);
                const status = ref('');
                
                // Форма редактора
                const editId = ref(null);
                const form = ref({ name: '', fact1: '', fact2: '', fact3: '', correct: 1 });

                const loadGuests = async () => {
                    const res = await fetch('/api/guests');
                    guests.value = await res.json();
                };

                const saveGuest = async () => {
                    if(!form.value.name) return alert('Введи имя!');
                    await fetch('/api/guests/save', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({...form.value, id: editId.value})
                    });
                    clearForm();
                    loadGuests();
                };
                
                const deleteGuest = async () => {
                    if(!confirm('Удалить?')) return;
                    await fetch('/api/guests/delete/'+editId.value, { method: 'POST' });
                    clearForm();
                    loadGuests();
                };

                const editGuest = (id, g) => {
                    editId.value = id;
                    form.value = {
                        name: g.name, 
                        fact1: g.facts[1], fact2: g.facts[2], fact3: g.facts[3], 
                        correct: g.correct 
                    };
                };

                const clearForm = () => {
                    editId.value = null;
                    form.value = { name: '', fact1: '', fact2: '', fact3: '', correct: 1 };
                };

                const runRound = async () => {
                    activeGuest.value = guests.value[selectedGuestId.value];
                    await fetch('/api/prepare_round/'+selectedGuestId.value, {method:'POST'});
                    status.value = 'Презентация запущена';
                };

                const api = async (ep) => {
                    status.value = '...';
                    await fetch('/api/'+ep, {method:'POST'});
                    status.value = 'OK';
                };

                onMounted(loadGuests);

                return { 
                    tab, guests, form, editId, selectedGuestId, activeGuest, status,
                    saveGuest, deleteGuest, editGuest, clearForm, runRound, api 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
