<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;}
        button { width: 100%; padding: 15px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1.1rem; margin-bottom: 10px; }
        button:hover { background: #34495e; }
        button.green { background: #27ae60; }
        button.red { background: #c0392b; }
        label { font-weight: bold; }
        .radio-group { display: flex; gap: 20px; margin-bottom: 15px; }
        .refresh-btn { font-size: 0.8rem; background: #7f8c8d; padding: 5px; width: auto; float: right;}
    </style>
</head>
<body>
    <div id="app">
        <h1>👮 Панель Ведущего</h1>
        
        <div class="card">
            <h2>1. Настройка раунда</h2>
            
            <label>
                Автор истории 
                <button class="refresh-btn" @click="fetchPlayers">🔄 Обновить список</button>
            </label>
            <select v-model="selectedAuthorId">
                <option :value="null" disabled>Выберите игрока...</option>
                <option v-for="p in players" :key="p.id" :value="p.id">
                    {{ p.name }}
                </option>
            </select>
            
            <label>Факт №1</label>
            <textarea v-model="form.fact1" rows="2"></textarea>
            
            <label>Факт №2</label>
            <textarea v-model="form.fact2" rows="2"></textarea>
            
            <label>Факт №3</label>
            <textarea v-model="form.fact3" rows="2"></textarea>

            <label>Какой факт ПРАВДА?</label>
            <div class="radio-group">
                <label><input type="radio" v-model="form.correct" :value="1"> Факт 1</label>
                <label><input type="radio" v-model="form.correct" :value="2"> Факт 2</label>
                <label><input type="radio" v-model="form.correct" :value="3"> Факт 3</label>
            </div>

            <button @click="prepareRound" :disabled="!selectedAuthorId">📡 Отправить на экран</button>
        </div>

        <div class="card">
            <h2>2. Управление игрой</h2>
            <button class="green" @click="startVoting">▶️ Запустить Голосование</button>
            <button class="red" @click="reveal">👀 Вскрыть карты</button>
            <hr>
            <button @click="reset">🔄 Сброс в лобби</button>
        </div>
        
        <p>Статус: {{ status }}</p>
    </div>

    <script>
        const { createApp, ref, onMounted, computed } = Vue;
        createApp({
            setup() {
                const status = ref('ready');
                const players = ref([]);
                const selectedAuthorId = ref(null);
                const form = ref({
                    fact1: '', fact2: '', fact3: '', correct: 1
                });

                const fetchPlayers = async () => {
                    const res = await fetch('/api/players');
                    players.value = await res.json();
                };

                const api = async (endpoint, body = {}) => {
                    await fetch('/api/' + endpoint, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(body)
                    });
                    status.value = endpoint + ' done';
                };

                const prepareRound = () => {
                    // Находим имя автора по ID
                    const authorObj = players.value.find(p => p.id === selectedAuthorId.value);
                    const payload = {
                        ...form.value,
                        author_id: selectedAuthorId.value,
                        author_name: authorObj ? authorObj.name : 'Unknown'
                    };
                    api('prepare', payload);
                };

                onMounted(fetchPlayers);

                return {
                    form, status, players, selectedAuthorId,
                    fetchPlayers, prepareRound,
                    startVoting: () => api('start_voting'),
                    reveal: () => api('reveal'),
                    reset: () => api('reset')
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
