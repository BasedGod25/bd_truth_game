<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Show</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #fff; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 90%; text-align: center; }
        
        /* Лобби */
        .lobby-info { font-size: 2rem; margin-top: 30px; background: rgba(255,255,255,0.1); display: inline-block; padding: 20px 40px; border-radius: 50px; }
        
        /* Презентация */
        .author-title { font-size: 3rem; color: #e94560; margin-bottom: 40px; text-transform: uppercase; }
        .facts-container { display: flex; gap: 20px; justify-content: center; }
        .fact-card { background: #16213e; border: 2px solid #0f3460; padding: 30px; border-radius: 15px; width: 30%; font-size: 1.5rem; line-height: 1.4; transition: all 0.5s; position: relative; }
        .fact-number { font-size: 4rem; font-weight: 900; color: #533483; position: absolute; top: -30px; left: 20px; background: #1a1a2e; padding: 0 10px; }
        
        /* Результаты */
        .vote-area { margin-top: 50px; height: 300px; display: flex; justify-content: space-around; align-items: flex-end; }
        .bar { width: 20%; background: #e94560; transition: height 0.5s; border-radius: 10px 10px 0 0; font-size: 2rem; font-weight: bold; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; min-height: 0px;}
        
        .fact-card.winner { background: #27ae60; border-color: #2ecc71; transform: scale(1.05); box-shadow: 0 0 30px rgba(46, 204, 113, 0.5); }
        .fact-card.loser { opacity: 0.3; filter: grayscale(1); }
        
        .leaderboard { margin-top: 30px; font-size: 1.2rem; }
        .lb-item { background: rgba(255,255,255,0.1); margin: 5px auto; width: 50%; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between;}
    </style>
</head>
<body>
    <div id="app" class="container">
        
        <div v-if="view === 'lobby'">
            <h1 style="font-size: 5rem;">ИГРА В ПРАВДУ</h1>
            <h2>Заходи в Telegram бота</h2>
            <div class="lobby-info">
                Игроков в сети: <strong>{{ playerCount }}</strong>
            </div>
        </div>

        <div v-else>
            <div class="author-title">Автор: {{ author }}</div>
            
            <div class="facts-container">
                <div class="fact-card" :class="getCardClass(1)">
                    <div class="fact-number">1</div>
                    {{ facts[1] }}
                </div>
                <div class="fact-card" :class="getCardClass(2)">
                    <div class="fact-number">2</div>
                    {{ facts[2] }}
                </div>
                <div class="fact-card" :class="getCardClass(3)">
                    <div class="fact-number">3</div>
                    {{ facts[3] }}
                </div>
            </div>

            <div v-if="view === 'voting' || view === 'result'" class="vote-area">
                <div class="bar" :style="{height: getBarHeight(1)}">{{ votes[1] }}</div>
                <div class="bar" :style="{height: getBarHeight(2)}">{{ votes[2] }}</div>
                <div class="bar" :style="{height: getBarHeight(3)}">{{ votes[3] }}</div>
            </div>

            <div v-if="view === 'result'" class="leaderboard">
                <h3>Топ Игроков:</h3>
                <div v-for="(u, i) in leaderboard.slice(0,5)" class="lb-item">
                    <span>{{ i+1 }}. {{ u.name }}</span>
                    <span>{{ u.score }}</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref } = Vue;
        const socket = io();

        createApp({
            setup() {
                const view = ref('lobby');
                const playerCount = ref(0);
                const author = ref('');
                const facts = ref({1:'', 2:'', 3:''});
                const votes = ref({1:0, 2:0, 3:0});
                const correct = ref(null);
                const leaderboard = ref([]);

                // --- СОБЫТИЯ ---
                
                // 1. Полная синхронизация при входе
                socket.on('sync_state', d => {
                    console.log("Sync:", d);
                    view.value = d.status;
                    playerCount.value = d.playerCount;
                    if (d.round_data) {
                        author.value = d.round_data.author;
                        facts.value = d.round_data.facts;
                    }
                    if (d.votes) votes.value = d.votes;
                });

                // 2. Обновление счетчика (срабатывает, когда кто-то ввел никнейм)
                socket.on('player_update', d => {
                    console.log("New player count:", d.count);
                    playerCount.value = d.count;
                });
                
                // 3. Смена этапа игры
                socket.on('state_update', d => {
                    view.value = d.status;
                    if(d.facts) {
                        author.value = d.author;
                        facts.value = d.facts;
                    }
                    if (d.status === 'presentation') {
                        votes.value = {1:0, 2:0, 3:0};
                        correct.value = null;
                    }
                });

                // 4. Живое голосование
                socket.on('vote_update', d => votes.value = d);
                
                // 5. Результаты
                socket.on('round_result', d => {
                    view.value = 'result';
                    correct.value = d.correct;
                    leaderboard.value = d.leaderboard;
                });

                // --- ВИЗУАЛ ---
                const getCardClass = (id) => {
                    if (view.value !== 'result') return '';
                    return id === correct.value ? 'winner' : 'loser';
                };

                const getBarHeight = (id) => {
                    const max = Math.max(Math.max(...Object.values(votes.value)), 1);
                    return (votes.value[id] / max * 250) + 'px';
                };

                return { view, playerCount, author, facts, votes, leaderboard, getCardClass, getBarHeight };
            }
        }).mount('#app');
    </script>
</body>
</html>
